<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Expense Tracker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      color: #1a1a2e;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 60%, #0f3460 100%);
      color: #fff;
      padding: 1.5rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 12px rgba(0,0,0,0.3);
    }
    header h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.5px; }
    header span { font-size: 0.85rem; opacity: 0.65; }

    .container { max-width: 1100px; margin: 2rem auto; padding: 0 1.5rem; }

    .cards-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .stat-card {
      background: #fff;
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      box-shadow: 0 1px 6px rgba(0,0,0,0.07);
    }
    .stat-card .label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: #888; margin-bottom: 0.4rem; }
    .stat-card .value { font-size: 1.75rem; font-weight: 700; color: #0f3460; }
    .stat-card.accent .value { color: #e94560; }

    .grid { display: grid; grid-template-columns: 380px 1fr; gap: 1.5rem; }
    @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.07);
      padding: 1.5rem;
    }
    .card h2 { font-size: 1rem; font-weight: 600; margin-bottom: 1.25rem; color: #333; }

    label { display: block; font-size: 0.8rem; font-weight: 600; color: #555; margin-bottom: 0.3rem; }
    input, select, textarea {
      width: 100%;
      padding: 0.6rem 0.9rem;
      border: 1.5px solid #e0e0e0;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
      font-family: inherit;
      background: #fafafa;
    }
    input:focus, select:focus, textarea:focus { border-color: #0f3460; background: #fff; }
    textarea { resize: vertical; min-height: 70px; }

    .form-row { margin-bottom: 1rem; }
    .form-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }

    button[type="submit"] {
      width: 100%;
      padding: 0.75rem;
      background: linear-gradient(135deg, #0f3460, #16213e);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: opacity 0.2s, transform 0.1s;
    }
    button[type="submit"]:hover { opacity: 0.9; }
    button[type="submit"]:active { transform: scale(0.98); }

    .toast {
      position: fixed; bottom: 1.5rem; right: 1.5rem;
      background: #1a1a2e; color: #fff;
      padding: 0.75rem 1.25rem; border-radius: 8px;
      font-size: 0.875rem; font-weight: 500;
      opacity: 0; transform: translateY(10px);
      transition: opacity 0.3s, transform 0.3s;
      z-index: 999; pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.error { background: #e94560; }

    .filter-bar {
      display: flex; gap: 0.75rem; margin-bottom: 1rem; flex-wrap: wrap;
      align-items: center;
    }
    .filter-bar select, .filter-bar input { width: auto; flex: 1; min-width: 140px; }
    .filter-bar label { display: none; }

    table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
    thead th {
      text-align: left; padding: 0.5rem 0.75rem;
      font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.07em;
      color: #888; border-bottom: 2px solid #f0f0f0;
    }
    tbody tr { border-bottom: 1px solid #f5f5f5; transition: background 0.15s; }
    tbody tr:hover { background: #fafbff; }
    tbody td { padding: 0.65rem 0.75rem; }
    .amount-cell { font-weight: 700; color: #0f3460; }
    .category-pill {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 600;
      background: #e8f0fe;
      color: #1a56db;
    }
    .delete-btn {
      background: none; border: none; cursor: pointer;
      color: #ccc; font-size: 1.1rem; line-height: 1;
      padding: 0.2rem 0.4rem; border-radius: 4px; transition: color 0.2s;
    }
    .delete-btn:hover { color: #e94560; }

    .empty-state { text-align: center; color: #bbb; padding: 2.5rem 1rem; font-size: 0.9rem; }

    .bar-chart { margin-top: 0.5rem; }
    .bar-row { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.6rem; font-size: 0.8rem; }
    .bar-label { width: 160px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #555; flex-shrink: 0; }
    .bar-track { flex: 1; background: #f0f0f0; border-radius: 20px; height: 10px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 20px; background: linear-gradient(90deg, #0f3460, #e94560); transition: width 0.5s ease; }
    .bar-amount { width: 80px; text-align: right; font-weight: 600; color: #0f3460; flex-shrink: 0; }
  </style>
</head>
<body>
<header>
  <h1>💳 Expense Tracker</h1>
  <span id="last-updated"></span>
</header>

<div class="container">
  <div class="cards-row" id="stats-row">
    <div class="stat-card">
      <div class="label">Total Expenses</div>
      <div class="value" id="stat-total">$0.00</div>
    </div>
    <div class="stat-card">
      <div class="label">Total Entries</div>
      <div class="value" id="stat-count">0</div>
    </div>
    <div class="stat-card accent">
      <div class="label">Top Category</div>
      <div class="value" id="stat-top" style="font-size:1.1rem;">—</div>
    </div>
    <div class="stat-card">
      <div class="label">This Month</div>
      <div class="value" id="stat-month">$0.00</div>
    </div>
  </div>

  <div class="grid">
    <!-- Form -->
    <div class="card">
      <h2>Add Expense</h2>
      <form id="expense-form">
        <div class="form-row">
          <label>Your Name *</label>
          <input type="text" id="submitter" placeholder="e.g. Jane Smith" required />
        </div>
        <div class="form-2col form-row">
          <div>
            <label>Amount ($) *</label>
            <input type="number" id="amount" placeholder="0.00" step="0.01" min="0.01" required />
          </div>
          <div>
            <label>Date *</label>
            <input type="date" id="date" required />
          </div>
        </div>
        <div class="form-row">
          <label>Category *</label>
          <select id="category" required>
            <option value="">Select a category...</option>
            {% for cat in categories %}
            <option value="{{ cat }}">{{ cat }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-row">
          <label>Description</label>
          <textarea id="description" placeholder="Optional notes..."></textarea>
        </div>
        <button type="submit">+ Add Expense</button>
      </form>
    </div>

    <!-- Right column -->
    <div style="display:flex;flex-direction:column;gap:1.25rem;">
      <!-- Expense list -->
      <div class="card" style="flex:1;">
        <h2>Expenses</h2>
        <div class="filter-bar">
          <select id="filter-category">
            <option value="">All Categories</option>
            {% for cat in categories %}
            <option value="{{ cat }}">{{ cat }}</option>
            {% endfor %}
          </select>
          <input type="text" id="filter-search" placeholder="Search submitter or notes..." />
        </div>
        <div style="overflow-x:auto;">
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Submitter</th>
                <th>Category</th>
                <th>Description</th>
                <th>Amount</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="expense-table"></tbody>
          </table>
          <div class="empty-state" id="empty-state" style="display:none;">No expenses yet. Add one to get started!</div>
        </div>
      </div>

      <!-- Summary chart -->
      <div class="card">
        <h2>Spending by Category</h2>
        <div class="bar-chart" id="bar-chart"></div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  let allExpenses = [];

  const fmt = (n) => '$' + parseFloat(n).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});

  function showToast(msg, isError=false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show' + (isError ? ' error' : '');
    setTimeout(() => t.className = 'toast', 2800);
  }

  function categoryColor(cat) {
    const colors = {
      "Travel": "#4f46e5",
      "Meals & Entertainment": "#0891b2",
      "Office Supplies": "#059669",
      "Software & Subscriptions": "#7c3aed",
      "Training & Development": "#b45309",
      "Marketing": "#db2777",
      "Utilities": "#0f3460",
      "Other": "#64748b"
    };
    return colors[cat] || "#64748b";
  }

  async function loadExpenses() {
    const res = await fetch('/api/expenses');
    allExpenses = await res.json();
    renderTable();
    renderStats();
    renderChart();
    document.getElementById('last-updated').textContent = 'Updated ' + new Date().toLocaleTimeString();
  }

  function renderTable() {
    const catFilter = document.getElementById('filter-category').value;
    const search = document.getElementById('filter-search').value.toLowerCase();
    const tbody = document.getElementById('expense-table');
    const empty = document.getElementById('empty-state');

    let rows = allExpenses.filter(e => {
      if (catFilter && e.category !== catFilter) return false;
      if (search && !e.submitter.toLowerCase().includes(search) && !(e.description||'').toLowerCase().includes(search)) return false;
      return true;
    });

    if (rows.length === 0) {
      tbody.innerHTML = '';
      empty.style.display = '';
    } else {
      empty.style.display = 'none';
      tbody.innerHTML = rows.map(e => `
        <tr>
          <td>${e.date}</td>
          <td>${escHtml(e.submitter)}</td>
          <td><span class="category-pill" style="background:${categoryColor(e.category)}22;color:${categoryColor(e.category)}">${escHtml(e.category)}</span></td>
          <td style="color:#666">${escHtml(e.description||'—')}</td>
          <td class="amount-cell">${fmt(e.amount)}</td>
          <td><button class="delete-btn" onclick="deleteExpense(${e.id})" title="Delete">x</button></td>
        </tr>
      `).join('');
    }
  }

  function renderStats() {
    const total = allExpenses.reduce((s, e) => s + e.amount, 0);
    document.getElementById('stat-total').textContent = fmt(total);
    document.getElementById('stat-count').textContent = allExpenses.length;

    const now = new Date();
    const thisMonth = allExpenses
      .filter(e => { const d = new Date(e.date); return d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear(); })
      .reduce((s, e) => s + e.amount, 0);
    document.getElementById('stat-month').textContent = fmt(thisMonth);

    const bycat = {};
    allExpenses.forEach(e => bycat[e.category] = (bycat[e.category]||0) + e.amount);
    const top = Object.entries(bycat).sort((a,b) => b[1]-a[1])[0];
    document.getElementById('stat-top').textContent = top ? top[0] : '—';
  }

  function renderChart() {
    const bycat = {};
    allExpenses.forEach(e => bycat[e.category] = (bycat[e.category]||0) + e.amount);
    const sorted = Object.entries(bycat).sort((a,b) => b[1]-a[1]);
    const max = sorted[0]?.[1] || 1;
    const chart = document.getElementById('bar-chart');
    if (sorted.length === 0) { chart.innerHTML = '<div class="empty-state">No data yet.</div>'; return; }
    chart.innerHTML = sorted.map(([cat, total]) => `
      <div class="bar-row">
        <div class="bar-label" title="${escHtml(cat)}">${escHtml(cat)}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${(total/max*100).toFixed(1)}%;background:linear-gradient(90deg,${categoryColor(cat)},${categoryColor(cat)}99)"></div></div>
        <div class="bar-amount">${fmt(total)}</div>
      </div>
    `).join('');
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  async function deleteExpense(id) {
    if (!confirm('Delete this expense?')) return;
    await fetch('/api/expenses/' + id, {method:'DELETE'});
    showToast('Expense deleted.');
    loadExpenses();
  }

  document.getElementById('expense-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const payload = {
      submitter: document.getElementById('submitter').value,
      amount: document.getElementById('amount').value,
      category: document.getElementById('category').value,
      date: document.getElementById('date').value,
      description: document.getElementById('description').value,
    };
    const res = await fetch('/api/expenses', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });
    if (res.ok) {
      showToast('Expense added!');
      e.target.reset();
      document.getElementById('date').value = new Date().toISOString().split('T')[0];
      loadExpenses();
    } else {
      const err = await res.json();
      showToast(err.error || 'Error adding expense.', true);
    }
  });

  document.getElementById('filter-category').addEventListener('change', renderTable);
  document.getElementById('filter-search').addEventListener('input', renderTable);

  document.getElementById('date').value = new Date().toISOString().split('T')[0];

  loadExpenses();
</script>
</body>
</html>
